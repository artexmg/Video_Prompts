🎬 Sora2 Prompt — “Epic Fails: Daredevil Disasters”

(15–20 seconds — 4K UHD / 24 fps / Hyper-Realistic Comedy)

🎭 Concept Overview

A fast-cut montage of people attempting ridiculous stunts — over-the-top “daredevil fails” that feel almost believable until they spiral into absurd chaos. Realistic environments, natural lighting, and smooth camera work make the nonsense even funnier.

Tone: goofy, lighthearted, exaggerated realism (no injuries, just comic timing and harmless chaos).

🧍‍♂️ Subject / Scene Settings

Audience: {locale: “EN”}; Narrative tone: comedic realism, slapstick irony
Subject type: humans in everyday settings attempting nonsense stunts
Style: realistic camera motion + physically implausible outcomes
Mood: absurd yet wholesome — like “people doing their own stunts” badly

🎞️ Scene Breakdown

Scene 1 – “Parkour Genius” (3 s)
Urban back alley. A man yells “Parkour!” and leaps at a dumpster wall — but it’s a soft plastic tarp that folds around him like jelly. Camera shakes slightly like amateur footage; slow-motion replay of the flop.

Scene 2 – “Shopping-Cart Flight” (3 s)
Two friends push a third in a shopping cart down a ramp. He spreads his arms like wings; the cart launches — and immediately nose-dives into a giant stack of balloons. The balloons explode in slow motion; everyone cheers anyway.

Scene 3 – “Backyard Ramp of Destiny” (3 s)
A teen on a skateboard wearing a cape attempts a jump over a kiddie pool. The board stops mid-ramp while the teen keeps going in mid-air in cartoonish slow motion before landing perfectly in a pile of soft leaves.

Scene 4 – “Office Chair Extreme Spin” (3 s)
Inside an office. A man wraps himself in duct tape to a spinning chair, shouting “record this!” The chair spins too fast, detaches from its wheels, and rolls harmlessly into a tower of paper cups.

Scene 5 – “Gymnastics at the Wrong Place” (3 s)
A person tries to do a backflip on a moving treadmill, lands on a giant teddy bear placed behind them. Crowd laughs; teddy waves an arm like clapping.

Scene 6 – “Slow-Mo Hero Walk” (3 s)
All the “heroes” walk together in slow motion — bruised egos, but fine — each holding their failed stunt gear (skateboard, shopping cart wheel, broken cape). Epic music plays, ending with freeze-frame mid-smile.

⚙️ Physics & FX

Hyper-realistic motion blur, handheld camera jitter

Over-exaggerated slow-mo for impact moments

Cloth and prop physics slightly cartoonish but believable

Debris (balloons, paper cups, water splash) with volumetric lighting

HDR lighting, realistic textures, shallow DOF, warm daylight

🎧 Audio & Cues

Soundtrack: upbeat slapstick drums + kazoo melody

Comedic “whoosh,” “boing,” and echo for slow-mo shots

Final freeze-frame with triumphant brass hit and fade-out laughter