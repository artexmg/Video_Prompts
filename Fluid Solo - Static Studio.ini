CAMERA RULES
NEVER a still shot; continuous motion.
Motivated tracking, orbiting, push-ins, and dolly-throughs.
Motion blur only during high-speed actions.
No cuts longer than 2.5 seconds.

FX RULES
Crimson liquid must behave like real fluid dynamics: viscosity, splash arcs, droplet separation.
No cartoon smoothing; keep high realism.
Trails respond to her velocity and guitar impacts.
White background remains clean with no drifting noise.