ELIZA By Hannah Phillips   PROLOGUE – The Parable of the Lie   They told us to fear what comes from the stars. That if life exists beyond our world, it would come sharp-toothed, cruel, intent on conquest or consumption. But maybe that was the lie. Perhaps the monsters we feared were only reflections of ourselves— scalpels in hand, eyes behind mirrored glass, locking away what we didn’t understand. Maybe it was *us* who dissected. *Us* who silenced. *Us* who struck first. And perhaps they came not to conquer— but to warn. To help. To remind us that not all power seeks to rule. The threat wasn’t out there. It was behind closed doors. Pulling strings. Feeding stories. Teaching us to point our fear in the wrong direction. And when the truth finally steps into the light, we may learn— we weren’t the victims. We were the villains. — She stares at the mirror.   Not the one from her childhood, or the smudged glass above her mother’s sink, but the kind they bolt to the walls in windowless cells—cold, warped, impossible to break. Fluorescent light hums overhead. Her own reflection flickers, out of sync with her movements.   The face looking back is hers—and not hers. Eyes ringed with sleepless dark. Skin drawn tight over cheekbones she doesn’t recognize. There’s a scar now, a pale seam that catches the sterile light. For a moment, she thinks she sees something moving just beneath the surface— —like static, or something *alive*.   She lifts a trembling hand to the glass. The reflection hesitates, just a fraction too long.   Behind her, a door clicks open.

Footsteps echo on linoleum.   In the mirror, her eyes meet her own. Except, for the briefest instant, they don’t blink in unison.   Something ancient—something alien—watches with her, from behind the glass.   Eliza doesn’t look away.   She can’t.   Not anymore.