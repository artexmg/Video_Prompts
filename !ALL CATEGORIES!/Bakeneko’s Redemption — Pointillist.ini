## Structure (Single-Cut, Dot-Flow 15 s)
Time	Visual Action	Camera / FX / Motion
0.0–2.0 s	Lightning Birth — Massive bolt tears void; dots explode outward, forming small glowing cat.	Static wide → micro push-in; bloom, particle attractor from lightning core.
2.0–4.5 s	Approach — Cat walks through raining dots; faint silhouette of torn-robed Reaper ahead.	Side track; dot-rain drift; low rumble builds.
4.5–7.5 s	Transformation — Bakeneko erupts into gigantic Nekomata; dots swirl like liquid fire.	Orbit 3/4 CW; particle curl noise; sync lightning to deep meow.
7.5–10.5 s	Clash — Reaper lunges, bones exposed; Nekomata strikes; Reaper disintegrates into particle storm.	Medium-wide; slow-mo at impact; particles collide with interference ripples.
10.5–13.0 s	Return — Dots spiral inward; giant fades to small cat again beside fallen child.	Slow pull-back; glow softens; particle implosion funnel.
13.0–15.0 s	Release — Child walks away; cat sits, halo flickers once; fade to black with last meow.	Locked static; vignette invert; white-on-black title fade in.



## Script Summary:

### Global Style & Settings
    Look: High-contrast pointillism, pure black background, images built from shimmering white dots.
    Animation Logic: All forms flow as particles, like liquid light/ink; transformations are waves of dots dissolving and reforming.
    Aspect/Res: 8K, 24 fps, cinematic lensing (35mm–85mm).
    Grade: Hard chiaroscuro; lightning = overexposed white branching bolts; everything else built from stipple.
    Audio Bed: Sparse wind + distant thunder. Reverb tails long, 2.5–3.5s.
    Cat’s Meow SFX:
    Meow A (cute): Soft, bell-like, short decay, slight chorus.
    Meow B (giant): Deep, sub-heavy, pitch-shifted 2 octaves down, long reverb, faint granular crackle, then back to Meow A when cat returns small.
    Reaper SFX: Dry bone clicks, robe tear, hollow wheeze, low spectral whisper.