DJ Reactor Girl — Ultra-Cut Edition

STYLE & AESTHETIC

kinetic ink-anime with neon red/white accents

micro-ink splatter always in motion

jacket + hair move constantly

no static lines, no frozen frames

camera always drifting: micro-orbit, dolly, tiny rotation

heavy bass-synced camera shake

glossy vinyl reflections

manga grain + bloom highlights

📌 SCENE BREAKDOWN (15 seconds)

Each scene ≤ 1.8s, most 1.2–1.5s.

0.0–0.2s — ANCHOR SHOT (0.2s)

Use uploaded image as starting frame, but:
hair flickers, jacket breathes, vinyl spins slowly, LED reflections vibrating.

0.2–1.4s — SCENE 1 (1.2s) — Reactor Boot-Up

Close-up on DJ console.
LED rings activate in cascading red pulses.
Cables twitch as power surges.
Her fingers hover over the buttons.

FX: micro-sparks, neon pulses
Camera: fast downward dolly

1.4–2.6s — SCENE 2 (1.2s) — Bass Sparks

Cut to her goggles: reflections of waveforms and shockwaves pulsing.
Her head tilts with confidence.

FX: refracted neon arcs
Camera: tight push-in

2.6–4.0s — SCENE 3 (1.4s) — Street Ripple

Wide shot.
A bass drop makes the concrete ripple outward like liquid vinyl.

Physics: asphalt waves, neon dust
Camera: low angle, small tilt

4.0–5.4s — SCENE 4 (1.4s) — Scratch Shockwave

Her hand scratches a turntable → sends a directional shockwave forward.
Neon signs distort and bend.

FX: distortion burst
Camera: whip-pan following the shockwave

5.4–6.8s — SCENE 5 (1.4s) — Ink Burst Behind Her

Behind her, a red-black ink cloud swirls non-stop, stretching with the bass.
Her jacket flutters intensely.

FX: flowing ink ribbons
Camera: micro-orbit around her shoulders

6.8–8.0s — SCENE 6 (1.2s) — Vinyl Spin Macro

Extreme macro shot of the vinyl platter spinning at impossible speed.
Reflections warp into spiraling cityscapes.

FX: spiral reflection distortion
Camera: macro tracking

8.0–9.2s — SCENE 7 (1.2s) — The Lift

She rises slightly from her crouch as if lifted by the bass pressure.
Hair jumps upward, jacket inflates with wind.

FX: pressure-pulse wind
Camera: upward dolly

9.2–10.5s — SCENE 8 (1.3s) — Reality Bend

Buildings around her tilt like turntables.
Street lights stretch downward like melting ink.

FX: urban distortion, ink drips
Camera: sideways drift

10.5–11.8s — SCENE 9 (1.3s) — Hand Control Shot

Close-up on her fingers turning a knob → concentric neon rings expand.

FX: ring pulses, micro-glints
Camera: rapid push-in then micro-vibration

11.8–13.2s — SCENE 10 (1.4s) — Final Drop Explosion

Massive red-white shockwave bursts outward.
Ink clouds explode and fold back inward.

FX: ink implosion + outward flash
Camera: heavy shake, push back

13.2–14.6s — SCENE 11 (1.4s) — Calm Power Pose

The world freezes around her, but she still moves (hair, jacket, vinyl).
She smirks slightly, goggles glowing red.

FX: slow drifting particles
Camera: smooth dolly close

14.6–15.0s — END CARD (0.4s)

White background with red neon ink calligraphy:
“BEAT REACTOR — RULE THE FREQUENCY”
Ink ripples gently.