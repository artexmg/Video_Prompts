ALLEY CHEF: DRAGON EDITION

Tone: comedic, fast-paced, urban-fantasy
Length: 15 seconds
Cuts: ~10–12 micro-scenes (1–2 seconds each)

Backstory (funny)

They said “don’t feed strays.”
Nobody warned us about dumpster dragons.

FULL SCENE BREAKDOWN (MORE CUTS)
0.0–1.0s — Alley Establishing Shot

Quick push-in. Trash papers swirl.
SFX: city hum + a tiny “growl-gurgle.”

1.0–2.0s — Dumpster Wiggle

Fast cut. Lid rattles like something inside wants out.
SFX: “clang-clang-clang!”

2.0–3.0s — Dragon Eye Blink

Close-up. The dragon’s big geometric eye blinks with a comedic “ploink.”
Paint drip wiggles.

3.0–4.0s — Dragon Sniff Shot

Profile angle. The dragon sniffs dramatically — tiny puff of steam.

4.0–5.0s — Flying Hot Dog Wrapper

Low-angle shot. A hot-dog wrapper floats past the dragon like a sign from the snack gods.
Dragon’s pupils track it.

5.0–6.0s — Dumpster POV

Inside-the-dumpster style shot: lid lifts slightly, dragon muzzle lowering toward it.
SFX: sneaky brass music cue.

6.0–7.0s — Dumpster Rejects It

SNAP CUT. The dumpster lid slams shut right in the dragon’s face.
SFX: metallic “BONK!”
The dragon recoils like, “hey!”

7.0–8.0s — Dragon Disappointment

Medium shot. Dragon slumps its head, giving a comedic “defeated” exhale.

8.0–9.0s — Alley Cutaway

Quick insert. Nearby graffiti briefly animates into a scribbled “NOPE.”

9.0–10.0s — Dragon Side Glance

Camera swings to catch the dragon giving a suspicious, offended side-eye at the dumpster.

10.0–11.0s — Another Attempt

Dragon tries to pry the lid gently with one horn.
Lid taps it like “don’t even.”

11.0–12.0s — COMEDIC ZOOM-PUNCH

Fast zoom-in on the dragon’s face.
Expression: “BRO REALLY??”

12.0–14.0s — Final Rejection

Dumpster graffiti letters briefly morph into: “NO SNACKS.”
Dragon sighs exaggeratedly.

14.0–15.0s — Ending Gag + END CARD

Dragon turns away dramatically as if insulted, knocking over a soda can.
Smash cut to end card:

“Urban Chef Fail — @artexmg”