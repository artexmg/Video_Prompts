ALPINE MIGRATION SEASON (15s · 30fps · 9:16 · Mockumentary tone)

🎨 STYLE & LOOK
• Hyper-detailed illustrated realism 
• Cinematic nature-documentary grading: cool shadows, crisp sunlight
• Calm handheld wildlife-camera movements
• On-screen behavior treated as completely normal in this universe
• Narration tone: BBC documentary style, male British narrator. calm, reverent.

LEG STYLE 
• The house’s legs must NOT look cartoonish, soft, or rubbery.
• Legs must match the hyper-detailed, engraved, European-storybook illustration style of the building.
• Use realistic avian scale patterning, with hard, segmented keratin plates and matte highlights.
• Shape: thick, weight-bearing bird legs similar to a giant eagle or cassowary, not chicken legs from a cartoon.
• Feathers near the upper thighs: stiff, patterned, etched like the roof shingles—consistent with the building’s architecture.
• Talons: curved keratin claws with worn, natural texture; no exaggerated shapes.
• Motion: heavy, deliberate, weighty steps that compress the cobblestones slightly.
• Coloring must match the palette of the building: muted browns, warm ochres, subtle greys — no bright oranges or saturated tones.
• Legs should feel like an extension of the house — ancient, architectural, believable, not whimsical limbs stuck on a cartoon.



🎬 SCENE BREAKDOWN (15 seconds)
(0.0–1.5s) — Establishing Wide

Camera gently glides over the busy alpine town square. People are walking and the wind blows gently
Soft wind. People going about their day.
CALM NARRATION:
“High in the mountain valleys, one of nature’s most elusive wanderers prepares for its seasonal journey…”

(1.5–3.0s) — Focus on the Building

Camera pushes toward the tall, whimsical inn.
A faint rumble under the foundation.
Pigeons scatter upward.
NARRATION (soft awe):
“The Great Alpine Walking-Inn.”

(3.0–5.0s) — Legs Emerge

Two enormous chicken legs unfold beneath the hotel, stretching like a waking creature.
Clouds of dust drift.
NARRATION:
“Every spring, it rises… shaking loose a winter’s worth of crumbs.”

(5.0–7.0s) — Standing Tall

The inn lifts itself fully upright.
Branches sway, windows rattle lightly.
Townspeople barely react — someone keeps sipping coffee.
NARRATION:
“Locals barely notice anymore. Migration has become part of the morning routine.”

(7.0–10.0s) — The First Steps

The legs take two slow, majestic steps through the plaza.
Cameras track from a low wildlife-shot angle.
A stray café umbrella topples gently.
NARRATION:
“With surprising grace, the Walking-Inn begins its long trek toward sunnier terraces…”

(10.0–13.0s) — The Walk of Destiny

A small dog trots alongside it proudly, as if escorting a sacred creature.
A child waves from below.
NARRATION (whispered reverence):
“…guided only by ancestral instinct… and a deep love of brunch.”

(13.0–15.0s) — End Card Shot

The inn strolls off toward the mountains, legs swaying like a gentle giant bird.
Sun gleams behind it.
END-CARD TEXT fades in:

“ALPINE MIGRATION SEASON
— A Walking-Inn Documentary —”

Soft orchestral “nature documentary” stinger.

