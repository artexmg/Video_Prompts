ELIZA — THE PARABLE OF THE LIE

Duration: 25 seconds
Aspect: 16:9 cinematic
FPS: 24
Style: Psychological sci-fi / sterile institutional horror
Motion Language: Minimal. Micro-instability only.
Tone: Mature. Controlled. Unavoidable.

🔒 WORLD LAW

• No jump scares
• No loud stingers
• No sudden cuts
• Tension builds through reflection instability
• Alien presence is implied — never shown

🔊 AUDIO DESIGN (Critical)

Industrial ambient × low PHONK pulse hybrid
Tempo: ~82 BPM
Sub-bass barely audible at start → increases gradually
Fluorescent hum is rhythmic
Distant metallic door reverbs
Low distorted breath textures layered under score

At 18s → bass drops out for 1 second. Silence.
Then returns colder.

TIMELINE
0.00 – 4.00

Black screen.
Soft fluorescent hum fades in.

Very faint whisper, almost subliminal:
“They told us to fear what comes from the stars…”

Slow fade into:

4.00 – 9.00

Medium shot — Eliza facing bolted institutional mirror.
• Fluorescent flicker slightly out of rhythm
• Reflection has 2-frame delay
• No music yet — only hum

Sub-bass enters at 8s.

9.00 – 13.00

Slow push-in toward mirror.

Her scar catches the sterile light.

Very subtle static texture beneath her skin — barely perceptible.

Voiceover (calm, restrained):
“Maybe the monsters were only reflections of ourselves…”

Reflection blinks half a beat late.

Camera does not react.

13.00 – 17.00

Extreme close-up of her eyes in mirror. 

Her real eye twitches.
Reflection stays still for a fraction.

Micro pixel-shear distortion across the glass surface.
Horizontal scanline glitch — 1 frame only.

Bass intensifies slightly.

17.00 – 20.00

Behind her — door clicks open.

Footsteps on linoleum.

Camera stays locked on mirror.

In reflection:
For 3 frames — her pupils dilate vertically, almost reptilian.

Not enough to be obvious.

At 18.00 — full audio drop.
Fluorescent hum stops. Silence.

20.00 – 23.00

Bass returns colder, distorted.

Reflection leans closer than she does.

Only by millimeters.

Voiceover:
“The threat wasn’t out there.”

23.00 – 25.00

Extreme stillness.

Her reflection finally blinks alone.

Cut to black.

Final whisper:
“We were the villains.”

No musical resolution.

🎭 VISUAL LANGUAGE NOTES

• No exaggerated glitching
• Instability must feel biological, not digital
• The alien is awareness, not creature
• Lighting remains harsh and sterile
• Camera movement extremely slow and deliberate