CORE IDEA (LOCKED)

There is no plan.
There is no strategy.
Only reaction.
Thinking is slower than dying.


CAMERA LAW 
FPV / cockpit-adjacent POV only
Constant forward velocity
Micro-jitter reduced 15% 
Whip-pans only on actual threat emergence, not ambient motion
Roll / yaw / pitch never settle, but stabilize briefly between maneuvers
Foreground occlusion remains, one dominant occluder per shot
Lens breathing during acceleration only (not constant)

Net effect:
The camera still panics — but it panics about one thing at a time.
PHYSICS RULES 
Debris has mass and inertia
Explosions push air, water, wreckage outward
Wreckage persists and becomes navigation hazards
Missiles curve late and violently

Constraint added:
❗ No more than ONE primary explosion per scene
Secondary damage allowed only if off-screen or implied.

This keeps impact felt, not smeared.

